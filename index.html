    <link rel="icon" type="image/png" href="/heart.png" />
    <link rel="preload" as="image" href="/profile.webp" fetchpriority="high" />
    <script>
      // Apply the saved theme before first paint so there is no light/dark flash.
      try {
        if (JSON.parse(localStorage.getItem("theme")) !== "light") document.documentElement.classList.add("dark");
      } catch {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
